name: Weekly Instagram+TikTok collection

on:
  # Schedule paused 2026-09-26: explicit decision to stop all Apify spend
  # (Reddit's daily fallback too, see pipeline.APIFY_REDDIT_ENABLED) and
  # preserve the ~$0.61 left of this cycle's $5 free credit for when
  # Instagram/TikTok get invested in properly, instead of trickling it away
  # a little each week. workflow_dispatch below still lets this be
  # triggered manually any time without re-adding the cron.
  # - cron: "0 6 * * 1"  # was: 06:00 UTC Monday = 07:00 Lisbon/London (BST)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Doppler CLI
        run: (curl -Ls --tlsv1.2 --proto "=https" https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh

      - name: Run weekly collection
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project tpl-brain --config dev -- python run_weekly.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-log-${{ github.run_id }}
          path: logs/*.log
          retention-days: 30
